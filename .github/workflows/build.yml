name: Build APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shared.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/shared.jks" >> "$GITHUB_ENV"
          fi
      - run: gradle assembleDebug
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk LabourTracker-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: LabourTracker-*.apk }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: LabourTracker-*.apk }
